name: Customer Analytics CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flagship_customer_analytics

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate demo dataset
        run: python src/generate_data.py

      - name: Train model
        run: python src/train.py

      - name: Run tests
        run: pytest -q
